name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" build/libs/ipwl-*.jar \
            --target "$GITHUB_SHA" \
            --title "ipwl $VERSION (build ${{ github.run_number }})" \
            --generate-notes
